name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gerar Gradle Wrapper
        working-directory: AndroidApp
        run: gradle wrapper --gradle-version 8.4

      - name: Compilar APK Debug
        working-directory: AndroidApp
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        working-directory: AndroidApp
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/SmartCool-Master-Telemetry.apk

      - name: Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCool-Master-Telemetry-APK
          path: AndroidApp/output/SmartCool-Master-Telemetry.apk

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SmartCool Master Telemetry Android App v1.0.0"
          body: |
            ### 📱 Aplicação Android Pronta para Instalar
            - Mantém o ecrã do telemóvel/tablet sempre ligado (**FLAG_KEEP_SCREEN_ON**).
            - Ecrã total imersivo sem barras de sistema.
            - Telemetria de hardware (CPU, GPU, RAM, VRAM, NVMe) ao vivo em tempo real.
            - Transmissão direta por Wi-Fi de alta definição.

            #### Como instalar:
            1. Descarrega o ficheiro `SmartCool-Master-Telemetry.apk` abaixo no teu telemóvel.
            2. Toca no ficheiro descarregado para instalar (autoriza "Instalar fontes desconhecidas" se o Android pedir).
            3. Abre a app e desfruta da monitorização contínua!
          files: AndroidApp/output/SmartCool-Master-Telemetry.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
