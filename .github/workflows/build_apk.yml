name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar APK Debug
        working-directory: AndroidApp
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        working-directory: AndroidApp
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/SmartCool-Master-Telemetry.apk

      - name: Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCool-Master-Telemetry-APK
          path: AndroidApp/output/SmartCool-Master-Telemetry.apk

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: "v1.0.0"
          name: "SmartCool Master Telemetry Android App v1.0.0"
          body: |
            ### 📱 Aplicação Android Oficial // Ecrã Sempre Ligado
            - **Ecrã NUNCA Desliga**: Configurado nativamente com `FLAG_KEEP_SCREEN_ON`.
            - **Modo Imersivo**: Ocupa o ecrã inteiro sem barras de notificações ou navegação.
            - **Zero Lag / Zero Congelamento**: Conexão Wi-Fi contínua direta ao PC.

            #### 📥 Como Instalar no Telemóvel:
            1. No teu telemóvel, abre esta página do GitHub e clica no ficheiro **`SmartCool-Master-Telemetry.apk`** abaixo.
            2. Quando o download terminar, toca no ficheiro para instalar.
            3. Se o Android pedir autorização, ativa "Permitir desta fonte" / "Instalar aplicações desconhecidas".
            4. Abre a aplicação **SmartCool** e o ecrã ficará sempre ligado a mostrar a telemetria do PC!
          files: AndroidApp/output/SmartCool-Master-Telemetry.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
