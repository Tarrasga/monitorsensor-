name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceitar Licenças e Configurar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > AndroidApp/local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a233e8b5d27b9c6a798f0dc5077\nd56f5187479451eabf01fb787729937f3c4741ce" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "85c4988457224f626568423774304db91659d3f2" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"

      - name: Compilar APK Debug
        working-directory: AndroidApp
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.log

      - name: Registar Resumo de Compilação
        if: always()
        run: |
          echo "### 📋 Log de Compilação Gradle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 /tmp/gradle_output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Renomear APK
        run: |
          mkdir -p output
          cp AndroidApp/app/build/outputs/apk/debug/app-debug.apk output/SmartCool-Master-Telemetry.apk
          ls -lh output/

      - name: Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCool-Master-Telemetry-APK
          path: output/SmartCool-Master-Telemetry.apk

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SmartCool Master Telemetry Android App v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Aplicação Android Oficial // Ecrã Sempre Ligado
            - **Ecrã NUNCA Desliga**: Configurado nativamente com `FLAG_KEEP_SCREEN_ON`.
            - **Modo Imersivo**: Ocupa o ecrã inteiro sem barras de notificações ou navegação.
            - **Zero Lag / Zero Congelamento**: Conexão Wi-Fi contínua direta ao PC.

            #### 📥 Como Instalar no Telemóvel:
            1. No teu telemóvel, abre esta página do GitHub e clica no ficheiro **`SmartCool-Master-Telemetry.apk`** abaixo.
            2. Quando o download terminar, toca no ficheiro para instalar.
            3. Se o Android pedir autorização, ativa "Permitir desta fonte" / "Instalar aplicações desconhecidas".
            4. Abre a aplicação **SmartCool** e o ecrã ficará sempre ligado a mostrar a telemetria do PC!
          files: output/SmartCool-Master-Telemetry.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
