plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tarrasga.smartcool'
    compileSdk 33

    defaultConfig {
        applicationId "com.tarrasga.smartcool"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
