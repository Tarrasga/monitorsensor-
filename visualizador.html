<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pré-visualização LCD SmartCool 480x320 - ROG Dark Gaming</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #0d0f12;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #ff3344;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      margin: 0 0 24px 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .preview-container {
      position: relative;
      width: 480px;
      height: 320px;
      border: 3px solid #232832;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 45, 65, 0.15);
      overflow: hidden;
      background: #000;
    }
    .preview-container img {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }
    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #181d24;
      border: 1px solid #333d4d;
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .badge span {
      color: #ff3344;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>TARRASGA // ROG Dark Gaming 480x320</h1>
  <p>Pré-visualização em tamanho real para o ecrã SmartCool no AIDA64</p>
  
  <div class="preview-container">
    <img src="tarrasga_rog_preview.png" alt="Pré-visualização ROG Dark Gaming">
  </div>

  <div class="buttons">
    <div class="badge">Resolução: <span>480 x 320 px</span></div>
    <div class="badge">Fundo limpo: <span>tarrasga_rog_480x320.png</span></div>
  </div>
</body>
</html>
